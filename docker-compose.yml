# Local development only. Production deployment targets Google Cloud Run
# (both backend and frontend) - see DEPLOYMENT_GCP.md. An Azure App Service /
# Static Web Apps path also still exists (DEPLOYMENT.md, infra/) if you're
# deploying there instead.
#
# `db` (Postgres) exists here because the backend no longer supports SQLite
# at all - `docker compose up` is what gives local dev a real Postgres with
# zero manual install, matching production's database exactly instead of a
# different engine with different locking/concurrency/SQL-dialect behavior.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resumebuilder
      POSTGRES_PASSWORD: resumebuilder
      POSTGRES_DB: resumebuilder
    ports:
      - "5433:5432"  # host 5433, not 5432, to avoid clashing with any other local Postgres
    volumes:
      - resumebuilder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumebuilder"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Overrides whatever DATABASE_URL is in backend/.env: inside the
      # compose network, Postgres is reachable at the `db` service name, not
      # `localhost` (localhost inside the backend container is the backend
      # container itself).
      DATABASE_URL: postgresql+psycopg://resumebuilder:resumebuilder@db:5432/resumebuilder
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  resumebuilder_pgdata:
