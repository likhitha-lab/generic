[pytest]
# Makes `import app...` (tests/conftest.py and every test module) resolve
# regardless of HOW pytest is invoked. Root cause this fixes: the backend
# has no packaging metadata (no pyproject.toml/setup.py/setup.cfg) - `app`
# has never been pip-installed - so it's only importable when `backend/`
# (this file's own directory, i.e. pytest's rootdir) is on sys.path.
# `python -m pytest` happens to add the CWD to sys.path (a side effect of
# Python's `-m` flag), which is why that invocation always worked; the
# bare `pytest` console-script entry point does NOT add the CWD - it adds
# its own script location instead - so `import app` fails for that
# invocation alone with "ModuleNotFoundError: No module named 'app'".
# `pythonpath` is pytest's own built-in option (core since pytest 7.0) for
# exactly this: it inserts rootdir-relative paths into sys.path during
# pytest's early config phase, BEFORE conftest.py is even imported - so it
# fixes bare `pytest`, `python -m pytest`, and any IDE test runner
# uniformly, with no PYTHONPATH env var, no editable install step, and no
# machine-specific setup. Committed here, so it's already in effect the
# moment someone clones the repo and runs pytest from backend/.
pythonpath = .
markers =
    live_gemini: hits the real Gemini API (needs a real GEMINI_API_KEY exported in the shell) - slow and costs money, so it is EXCLUDED by default (see addopts below). Run explicitly with `pytest -m live_gemini` to validate against real Gemini output.
addopts = -m "not live_gemini"
