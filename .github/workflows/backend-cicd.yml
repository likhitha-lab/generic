# CI/CD for the FastAPI backend -> Azure App Service.
#
# This workflow is provided as code but has never been run - it requires
# real Azure credentials configured as GitHub repository secrets before it
# can deploy anything (see ../../DEPLOYMENT.md). Until then, the "test"
# job still runs on every push/PR and is safe to leave enabled: it only
# installs dependencies and runs the local test suite against SQLite, no
# Azure access needed.
name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure - see DEPLOYMENT.md

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          STORAGE_BACKEND: "local"
          JWT_SECRET_KEY: "ci-test-secret"
          GEMINI_API_KEY: "unused-in-ci"
        # `python -m pytest`, not bare `pytest` - only the `-m` form adds the
        # current directory (backend/, via `defaults.run.working-directory`
        # above) to sys.path, which `tests/conftest.py`'s `import app...`
        # needs to resolve the `app` package. Bare `pytest` invokes its own
        # console-script entry point, which does not add cwd to sys.path -
        # that's what produced "ModuleNotFoundError: No module named 'app'".
        run: |
          if [ -d tests ]; then python -m pytest -v; else echo "No tests/ directory yet - skipping"; fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies into a deployable package
        run: |
          pip install -r requirements.txt --target=.python_packages/lib/site-packages

      # Requires an Azure AD app registration federated with this repo via
      # OIDC (no client secret stored in GitHub) - see DEPLOYMENT.md for the
      # `az ad app federated-credential create` command that sets this up.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          package: backend
